<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymSmartTrack" />
  <meta name="theme-color" content="#111111" />
  <title>GymSmartTrack</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&family=Barlow+Condensed:wght@600;700;800;900&display=swap');
    :root {
      --red: #E30613;
      --red-dark: #B8000F;
      --red-glow: rgba(227,6,19,0.14);
      --bg: #111111;
      --surface: #1c1c1c;
      --surface2: #252525;
      --surface3: #2e2e2e;
      --border: #2e2e2e;
      --border2: #3d3d3d;
      --text: #f0f0f0;
      --text-dim: #888;
      --text-faint:#555;
      --green: #22c55e;
      --amber: #f59e0b;
      --radius: 10px;
      --radius-lg: 16px;
      --font: 'Barlow', sans-serif;
      --font-cd: 'Barlow Condensed', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* TOP BAR, PAGES, CARDS, ecc. (stessi stili originali) */
    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 60; background: rgba(17,17,17,0.97); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); }
    .topbar-inner { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 52px; }
    .logo { display: flex; align-items: center; gap: 9px; flex-shrink: 0; text-decoration: none; }
    .person-scroll { display: flex; align-items: center; gap: 6px; overflow-x: auto; flex: 1; }
    .person-chip { white-space: nowrap; background: var(--surface2); border: 1px solid var(--border2); border-radius: 5px; padding: 5px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .person-chip.active { background: var(--red); color: #fff; border-color: var(--red); }
    .page { display: none; padding: 0 15px; padding-top: calc(52px + env(safe-area-inset-top) + 14px); padding-bottom: calc(60px + env(safe-area-inset-bottom) + 14px); max-width: 640px; margin: 0 auto; }
    .page.active { display: block; }
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .page-title { font-family: var(--font-cd); font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-label::after { content:''; flex:1; height:1px; background:var(--border); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 9px; }
    .btn { background: var(--red); color: #fff; border: none; border-radius: var(--radius); font-weight: 700; padding: 14px; width: 100%; cursor: pointer; }
    .btn.ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
    .input-group input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); padding: 12px 13px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(17,17,17,.97); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4,1fr); padding-bottom: env(safe-area-inset-bottom); }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-faint); font-size: 9px; font-weight: 700; padding: 10px 0; }
    .nav-btn.active { color: var(--red); }
    .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.78); display: none; align-items: flex-end; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border2); border-bottom: none; border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); width: 100%; max-width: 640px; max-height: 92dvh; overflow-y: auto; }

    /* MAPPA CORPO */
    .muscle-map-container { background: var(--surface2); border-radius: var(--radius-lg); padding: 15px; margin: 12px 0; }
    .muscle-map-container svg { width: 100%; max-height: 380px; }
    .muscle-region { cursor: pointer; transition: all 0.2s; stroke: #444; stroke-width: 2; }
    .muscle-region:hover { stroke: var(--red); stroke-width: 4; }
    .muscle-region.selected { fill: var(--red); stroke: #fff; stroke-width: 3; }
    .muscle-map-header { display: flex; justify-content: center; gap: 12px; margin-bottom: 12px; }
    .view-btn { padding: 8px 20px; border-radius: 30px; background: var(--surface3); border: 1px solid var(--border2); font-weight: 600; cursor: pointer; }
    .view-btn.active { background: var(--red); color: white; border-color: var(--red); }
    .selected-muscles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .muscle-tag { background: var(--red); color: white; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }
  </style>
</head>
