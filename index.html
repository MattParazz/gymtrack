<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymTrack" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>GymTrack</title>

  <!-- PWA manifest inline -->
  <link rel="manifest" href="manifest.json" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3a;
      --accent: #c8f55a;
      --accent2: #5af5c8;
      --accent3: #f55a8f;
      --text: #f0f0f0;
      --text-dim: #7a7a9a;
      --radius: 16px;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-head);
      min-height: 100dvh;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── NAV ── */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: rgba(13,13,20,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-head);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 0;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 22px; height: 22px; }

    /* ── PAGES ── */
    .page { display: none; padding: 0 16px; padding-top: 60px; padding-bottom: 100px; max-width: 600px; margin: 0 auto; }
    .page.active { display: block; }

    /* ── HEADER ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }
    .page-title span { color: var(--accent); }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }
    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-name {
      font-size: 16px;
      font-weight: 700;
    }
    .card-sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 3px;
      font-family: var(--font-mono);
    }
    .badge {
      background: var(--accent);
      color: var(--bg);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      font-family: var(--font-mono);
    }
    .badge.green { background: var(--accent2); }
    .badge.red { background: var(--accent3); }

    /* ── BUTTONS ── */
    .btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 15px;
      padding: 14px 20px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { opacity: 0.8; transform: scale(0.98); }
    .btn.secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.danger { background: var(--accent3); color: #fff; }
    .btn.sm { font-size: 13px; padding: 10px 16px; width: auto; border-radius: 10px; }

    /* ── INPUTS ── */
    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 7px;
    }
    .input-group input, .input-group select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: var(--font-head);
      font-size: 15px;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    .input-group input:focus, .input-group select:focus { border-color: var(--accent); }

    /* ── CHIPS ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
      margin-top: 24px;
    }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-dim);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty h3 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .empty p { font-size: 14px; line-height: 1.5; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      width: 100%;
      max-width: 600px;
      animation: slideUp 0.28s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    /* ── CHART CANVAS ── */
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .chart-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .chart-meta {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-bottom: 14px;
    }
    canvas { width: 100% !important; }

    /* ── PR BADGE ── */
    .pr-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      gap: 8px;
    }
    .pr-box {
      flex: 1;
      background: var(--surface2);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .pr-box .val {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .pr-box .lbl {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* ── PERSON SELECTOR ── */
    .person-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .person-bar::-webkit-scrollbar { display: none; }
    .person-chip {
      white-space: nowrap;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .person-chip.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .person-chip.add-btn {
      background: none;
      border-style: dashed;
      color: var(--text-dim);
    }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      color: var(--text-dim);
      transition: all 0.15s;
    }
    .icon-btn:active { opacity: 0.7; }

    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .log-item:last-child { border-bottom: none; }
    .log-date { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
    .log-val { font-size: 16px; font-weight: 700; font-family: var(--font-mono); }
    .log-val span { font-size: 11px; color: var(--text-dim); }

    .trend-up { color: var(--accent2); }
    .trend-down { color: var(--accent3); }
  </style>
</head>
<body>

<!-- PERSON BAR -->
<div class="person-bar" id="personBar"></div>

<!-- PAGES -->
<div class="page active" id="page-log">
  <div class="page-header">
    <div class="page-title">Allenamento<br><span>di oggi</span></div>
    <button class="btn sm" onclick="openModal('addLog')">+ Aggiungi</button>
  </div>
  <div id="todayList"></div>
</div>

<div class="page" id="page-history">
  <div class="page-header">
    <div class="page-title">Storico<br><span>esercizi</span></div>
  </div>
  <div id="exerciseList"></div>
</div>

<div class="page" id="page-charts">
  <div class="page-header">
    <div class="page-title">Grafici<br><span>progressi</span></div>
  </div>
  <div class="input-group">
    <label>Esercizio</label>
    <select id="chartExerciseSelect" onchange="renderChart()"></select>
  </div>
  <div id="chartArea"></div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="showPage('log', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 4v16m-8-8h16"/></svg>
    Oggi
  </button>
  <button class="nav-btn" onclick="showPage('history', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h10"/></svg>
    Storico
  </button>
  <button class="nav-btn" onclick="showPage('charts', this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Grafici
  </button>
</nav>

<!-- MODALS -->
<div class="modal-overlay" id="modal-addLog">
  <div class="modal">
    <div class="modal-title">📝 Aggiungi serie</div>
    <div class="input-group">
      <label>Esercizio</label>
      <input type="text" id="newExercise" placeholder="es. Panca piana, Squat..." list="exerciseSuggestions" />
      <datalist id="exerciseSuggestions"></datalist>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="input-group" style="flex:1">
        <label>Peso (kg)</label>
        <input type="number" id="newWeight" placeholder="80" min="0" step="0.5" />
      </div>
      <div class="input-group" style="flex:1">
        <label>Reps</label>
        <input type="number" id="newReps" placeholder="8" min="1" />
      </div>
    </div>
    <div class="input-group">
      <label>Serie</label>
      <input type="number" id="newSets" placeholder="3" min="1" />
    </div>
    <div class="input-group">
      <label>Data</label>
      <input type="date" id="newDate" />
    </div>
    <button class="btn" onclick="saveLog()">Salva</button>
    <div style="height:10px"></div>
    <button class="btn secondary" onclick="closeModal('addLog')">Annulla</button>
  </div>
</div>

<div class="modal-overlay" id="modal-addPerson">
  <div class="modal">
    <div class="modal-title">👤 Aggiungi persona</div>
    <div class="input-group">
      <label>Nome</label>
      <input type="text" id="newPersonName" placeholder="Mario Rossi" />
    </div>
    <button class="btn" onclick="savePerson()">Aggiungi</button>
    <div style="height:10px"></div>
    <button class="btn secondary" onclick="closeModal('addPerson')">Annulla</button>
  </div>
</div>

<div class="modal-overlay" id="modal-exerciseDetail">
  <div class="modal">
    <div class="modal-title" id="detailTitle"></div>
    <div id="detailContent"></div>
    <button class="btn secondary" onclick="closeModal('exerciseDetail')">Chiudi</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────────────────────
let state = {
  persons: [],      // [{id, name}]
  logs: [],         // [{id, personId, exercise, weight, reps, sets, date}]
  currentPerson: null,
};

function save() { localStorage.setItem('gymtrack_v2', JSON.stringify(state)); }
function load() {
  const raw = localStorage.getItem('gymtrack_v2');
  if (raw) state = JSON.parse(raw);
  if (!state.persons) state.persons = [];
  if (!state.logs) state.logs = [];
}

// ── INIT ───────────────────────────────────────────────────────────────
load();
if (state.persons.length === 0) {
  state.persons.push({ id: uid(), name: 'Io' });
  save();
}
if (!state.currentPerson || !state.persons.find(p => p.id === state.currentPerson)) {
  state.currentPerson = state.persons[0].id;
}

document.getElementById('newDate').value = today();

render();

// ── UTILS ──────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function today() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) {
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function currentLogs() { return state.logs.filter(l => l.personId === state.currentPerson); }

// ── PAGES ──────────────────────────────────────────────────────────────
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'charts') renderChartPage();
  if (id === 'history') renderHistory();
  if (id === 'log') renderToday();
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render() {
  renderPersonBar();
  renderToday();
  renderHistory();
  populateSuggestions();
}

function renderPersonBar() {
  const bar = document.getElementById('personBar');
  bar.innerHTML = state.persons.map(p => `
    <div class="person-chip ${p.id === state.currentPerson ? 'active' : ''}"
         onclick="selectPerson('${p.id}')">${p.name}</div>
  `).join('') + `
    <div class="person-chip add-btn" onclick="openModal('addPerson')">+ Persona</div>
  `;
}

function renderToday() {
  const list = document.getElementById('todayList');
  const todayStr = today();
  const logs = currentLogs().filter(l => l.date === todayStr);

  if (logs.length === 0) {
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">🏋️</div>
      <h3>Nessun esercizio oggi</h3>
      <p>Tocca "+ Aggiungi" per iniziare<br>il tuo allenamento di oggi.</p>
    </div>`;
    return;
  }

  const grouped = {};
  logs.forEach(l => {
    if (!grouped[l.exercise]) grouped[l.exercise] = [];
    grouped[l.exercise].push(l);
  });

  list.innerHTML = Object.entries(grouped).map(([ex, entries]) => {
    const last = entries[entries.length - 1];
    const prev = bestBefore(ex, todayStr);
    const diff = prev ? last.weight - prev : null;
    const diffHtml = diff !== null
      ? `<span class="${diff >= 0 ? 'trend-up' : 'trend-down'}">${diff >= 0 ? '▲' : '▼'} ${Math.abs(diff)} kg vs prev</span>`
      : '';
    const rows = entries.map(e =>
      `<div class="log-item">
        <div><div class="log-val">${e.weight} <span>kg</span></div><div class="log-date">${e.sets}x${e.reps} reps</div></div>
        <button class="icon-btn" onclick="deleteLog('${e.id}')">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>`
    ).join('');
    return `<div class="card">
      <div class="card-row">
        <div>
          <div class="card-name">${ex}</div>
          <div class="card-sub">${entries.length} serie ${diffHtml}</div>
        </div>
        <div class="badge">${last.weight} kg</div>
      </div>
      <div style="margin-top:12px">${rows}</div>
    </div>`;
  }).join('');
}

function bestBefore(exercise, dateStr) {
  const prev = currentLogs()
    .filter(l => l.exercise === exercise && l.date < dateStr)
    .sort((a,b) => b.date.localeCompare(a.date));
  return prev.length ? prev[0].weight : null;
}

function renderHistory() {
  const list = document.getElementById('exerciseList');
  const logs = currentLogs();
  if (logs.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><h3>Nessuno storico</h3><p>Aggiungi il tuo primo allenamento dalla scheda "Oggi".</p></div>`;
    return;
  }
  const exercises = [...new Set(logs.map(l => l.exercise))].sort();
  list.innerHTML = exercises.map(ex => {
    const exLogs = logs.filter(l => l.exercise === ex).sort((a,b) => b.date.localeCompare(a.date));
    const pr = Math.max(...exLogs.map(l => l.weight));
    const last = exLogs[0];
    return `<div class="card" onclick="showDetail('${ex}')" style="cursor:pointer">
      <div class="card-row">
        <div>
          <div class="card-name">${ex}</div>
          <div class="card-sub">${exLogs.length} sessioni · ultimo ${fmtDate(last.date)}</div>
        </div>
        <div>
          <div class="badge" style="background:var(--accent2);color:var(--bg)">PR ${pr} kg</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function showDetail(exercise) {
  const logs = currentLogs().filter(l => l.exercise === exercise).sort((a,b) => b.date.localeCompare(a.date));
  const pr = Math.max(...logs.map(l => l.weight));
  const last = logs[0];
  document.getElementById('detailTitle').textContent = exercise;
  document.getElementById('detailContent').innerHTML = `
    <div class="pr-row" style="margin-bottom:16px">
      <div class="pr-box"><div class="val">${pr} kg</div><div class="lbl">Record (PR)</div></div>
      <div class="pr-box"><div class="val">${last.weight} kg</div><div class="lbl">Ultima volta</div></div>
      <div class="pr-box"><div class="val">${logs.length}</div><div class="lbl">Sessioni</div></div>
    </div>
    <div class="section-label">Storico</div>
    ${logs.map(l => `
      <div class="log-item">
        <div class="log-date">${fmtDate(l.date)}</div>
        <div class="log-val">${l.weight} kg <span>${l.sets}x${l.reps}</span></div>
      </div>
    `).join('')}
    <div style="height:16px"></div>
  `;
  openModal('exerciseDetail');
}

// ── CHARTS ─────────────────────────────────────────────────────────────
let chartInstance = null;

function renderChartPage() {
  const sel = document.getElementById('chartExerciseSelect');
  const exercises = [...new Set(currentLogs().map(l => l.exercise))].sort();
  sel.innerHTML = exercises.length
    ? exercises.map(e => `<option value="${e}">${e}</option>`).join('')
    : '<option value="">Nessun dato ancora</option>';
  renderChart();
}

function renderChart() {
  const area = document.getElementById('chartArea');
  const exercise = document.getElementById('chartExerciseSelect').value;
  if (!exercise) { area.innerHTML = `<div class="empty"><div class="empty-icon">📈</div><h3>Nessun dato</h3><p>Aggiungi degli allenamenti per vedere i tuoi progressi.</p></div>`; return; }

  const logs = currentLogs()
    .filter(l => l.exercise === exercise)
    .sort((a,b) => a.date.localeCompare(b.date));

  // Group by date, take max weight per day
  const byDate = {};
  logs.forEach(l => {
    if (!byDate[l.date] || l.weight > byDate[l.date]) byDate[l.date] = l.weight;
  });

  const labels = Object.keys(byDate).map(fmtDate);
  const data = Object.values(byDate);
  const pr = Math.max(...data);
  const first = data[0], last2 = data[data.length - 1];
  const progress = last2 - first;

  area.innerHTML = `
    <div class="pr-row" style="margin-bottom:14px">
      <div class="pr-box"><div class="val">${pr} kg</div><div class="lbl">Record</div></div>
      <div class="pr-box"><div class="val ${progress >= 0 ? 'trend-up' : 'trend-down'}">${progress >= 0 ? '+' : ''}${progress} kg</div><div class="lbl">Progresso</div></div>
      <div class="pr-box"><div class="val">${data.length}</div><div class="lbl">Sessioni</div></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">${exercise}</div>
      <div class="chart-meta">Peso massimo per sessione (kg)</div>
      <canvas id="myChart" height="200"></canvas>
    </div>
  `;

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const ctx = document.getElementById('myChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Peso (kg)',
        data,
        borderColor: '#c8f55a',
        backgroundColor: 'rgba(200,245,90,0.08)',
        pointBackgroundColor: '#c8f55a',
        pointBorderColor: '#0a0a0f',
        pointBorderWidth: 2,
        pointRadius: 5,
        tension: 0.35,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c1c28',
          borderColor: '#2a2a3a',
          borderWidth: 1,
          titleColor: '#7a7a9a',
          bodyColor: '#c8f55a',
          bodyFont: { family: 'Space Mono', size: 14 },
          callbacks: { label: ctx => ` ${ctx.raw} kg` }
        }
      },
      scales: {
        x: {
          ticks: { color: '#7a7a9a', font: { family: 'Space Mono', size: 10 }, maxRotation: 45 },
          grid: { color: '#2a2a3a' }
        },
        y: {
          ticks: { color: '#7a7a9a', font: { family: 'Space Mono', size: 11 }, callback: v => v + ' kg' },
          grid: { color: '#2a2a3a' }
        }
      }
    }
  });
}

// ── ACTIONS ────────────────────────────────────────────────────────────
function saveLog() {
  const exercise = document.getElementById('newExercise').value.trim();
  const weight = parseFloat(document.getElementById('newWeight').value);
  const reps = parseInt(document.getElementById('newReps').value);
  const sets = parseInt(document.getElementById('newSets').value) || 1;
  const date = document.getElementById('newDate').value || today();

  if (!exercise || isNaN(weight) || isNaN(reps)) {
    alert('Inserisci esercizio, peso e reps!'); return;
  }

  state.logs.push({ id: uid(), personId: state.currentPerson, exercise, weight, reps, sets, date });
  save();
  populateSuggestions();
  closeModal('addLog');
  // clear fields except date
  document.getElementById('newExercise').value = '';
  document.getElementById('newWeight').value = '';
  document.getElementById('newReps').value = '';
  document.getElementById('newSets').value = '';
  renderToday();
  renderHistory();
}

function deleteLog(id) {
  if (!confirm('Eliminare questa serie?')) return;
  state.logs = state.logs.filter(l => l.id !== id);
  save();
  renderToday();
  renderHistory();
}

function savePerson() {
  const name = document.getElementById('newPersonName').value.trim();
  if (!name) { alert('Inserisci un nome!'); return; }
  const person = { id: uid(), name };
  state.persons.push(person);
  state.currentPerson = person.id;
  save();
  document.getElementById('newPersonName').value = '';
  closeModal('addPerson');
  render();
}

function selectPerson(id) {
  state.currentPerson = id;
  save();
  render();
}

function populateSuggestions() {
  const all = [...new Set(state.logs.map(l => l.exercise))].sort();
  document.getElementById('exerciseSuggestions').innerHTML = all.map(e => `<option value="${e}">`).join('');
}

// ── MODALS ─────────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById('modal-' + id).classList.add('open');
  if (id === 'addLog') document.getElementById('newDate').value = today();
}
function closeModal(id) { document.getElementById('modal-' + id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});
</script>
</body>
</html>
