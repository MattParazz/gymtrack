<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GymSmartTrack"/>
<meta name="theme-color" content="#111111"/>
<title>GymSmartTrack</title>
<link rel="manifest" href="manifest.json"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --red:#E30613;--red-d:#B8000F;--red-g:rgba(227,6,19,.14);
  --bg:#111;--s1:#1c1c1c;--s2:#252525;--s3:#2e2e2e;
  --b1:#2e2e2e;--b2:#3d3d3d;
  --tx:#f0f0f0;--td:#888;--tf:#555;
  --green:#22c55e;--gb:rgba(34,197,94,.10);
  --amber:#f59e0b;
  --r:10px;--rl:16px;
  --f:'Barlow',sans-serif;--fc:'Barlow Condensed',sans-serif;
}
body{background:var(--bg);color:var(--tx);font-family:var(--f);min-height:100dvh;overflow-x:hidden;}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(17,17,17,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--b1);padding-top:env(safe-area-inset-top);}
.topbar-inner{display:flex;align-items:center;gap:10px;padding:0 14px;height:52px;}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-name{font-family:var(--fc);font-size:15px;font-weight:900;color:var(--tx);letter-spacing:.02em;}
.logo-name em{color:var(--red);font-style:normal;}
.person-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;}
.person-scroll::-webkit-scrollbar{display:none;}
.pchip{white-space:nowrap;flex-shrink:0;background:var(--s2);border:1px solid var(--b2);border-radius:5px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;transition:all .15s;}
.pchip.act{background:var(--red);color:#fff;border-color:var(--red);}
.sync-pill{display:flex;align-items:center;gap:5px;background:var(--s2);border:1px solid var(--b1);border-radius:20px;padding:3px 9px;flex-shrink:0;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--tf);transition:background .3s;flex-shrink:0;}
.sdot.ok{background:var(--green);}
.sdot.err{background:var(--red);}
.sdot.loading{background:var(--amber);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.slbl{font-size:9px;font-weight:700;color:var(--td);letter-spacing:.05em;text-transform:uppercase;}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(17,17,17,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--b1);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--tf);font-family:var(--f);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 0;cursor:pointer;transition:color .18s;position:relative;}
.nb::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--red);border-radius:0 0 2px 2px;opacity:0;transition:opacity .18s;}
.nb.act{color:var(--red);}
.nb.act::before{opacity:1;}
.nb svg{width:20px;height:20px;}

/* ── PAGES ── */
.page{display:none;padding:0 15px;padding-top:calc(52px + env(safe-area-inset-top) + 14px);padding-bottom:calc(64px + env(safe-area-inset-bottom) + 14px);max-width:640px;margin:0 auto;}
.page.act{display:block;}
.ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--b1);}
.pt{font-family:var(--fc);font-size:26px;font-weight:900;text-transform:uppercase;line-height:1;}
.pt em{color:var(--red);font-style:normal;}
.pdate{font-size:10px;color:var(--td);margin-top:3px;}

/* ── SECTION LABEL ── */
.sl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tf);margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
.sl::after{content:'';flex:1;height:1px;background:var(--b1);}

/* ── CARDS ── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:13px 15px;margin-bottom:9px;}
.card.rl{border-left:3px solid var(--red);}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cn{font-size:14px;font-weight:700;}
.cm{font-size:11px;color:var(--td);margin-top:2px;}

/* ── BADGES ── */
.badge{font-family:var(--fc);font-size:12px;font-weight:800;padding:3px 9px;border-radius:5px;white-space:nowrap;letter-spacing:.03em;}
.badge.red{background:var(--red);color:#fff;}
.badge.green{background:var(--gb);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.badge.grey{background:var(--s2);color:var(--td);border:1px solid var(--b2);}

/* ── STAT GRID ── */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
.sb{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:10px 8px;text-align:center;}
.sv{font-family:var(--fc);font-size:20px;font-weight:900;color:var(--red);line-height:1;}
.sv.g{color:var(--green);}
.sv.w{color:var(--tx);}
.slb{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tf);margin-top:3px;}

/* ── BUTTONS ── */
.btn{background:var(--red);color:#fff;border:none;border-radius:var(--r);font-family:var(--f);font-weight:700;font-size:14px;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:opacity .15s,transform .1s;letter-spacing:.02em;}
.btn:active{opacity:.85;transform:scale(.98);}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--b2);}
.btn.sm{font-size:11px;padding:7px 13px;border-radius:6px;text-transform:uppercase;letter-spacing:.06em;}
.btn-full{width:100%;padding:13px;}

/* ── INPUTS ── */
.ig{margin-bottom:12px;}
.ig label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--td);margin-bottom:6px;}
.ig input,.ig select{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);color:var(--tx);font-family:var(--f);font-size:15px;font-weight:500;padding:12px 13px;outline:none;appearance:none;transition:border-color .2s,box-shadow .2s;}
.ig input:focus,.ig select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-g);}
.ir{display:flex;gap:10px;}
.ir .ig{flex:1;}

/* ── LOG ROWS ── */
.lr{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b1);}
.lr:last-child{border-bottom:none;}
.lv{font-family:var(--fc);font-size:17px;font-weight:800;}
.ls{font-size:11px;color:var(--td);margin-top:1px;}
.icon-btn{background:var(--s2);border:1px solid var(--b1);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--td);transition:all .15s;}
.icon-btn:active{background:var(--red-g);border-color:var(--red);color:var(--red);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--s1);border:1px solid var(--b2);border-bottom:none;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px;animation:slideUp .24s cubic-bezier(.32,.72,0,1);max-height:92dvh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.mhandle{width:36px;height:4px;background:var(--b2);border-radius:2px;margin:0 auto 16px;}
.mt{font-family:var(--fc);font-size:21px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;margin-bottom:16px;}
.mt em{color:var(--red);font-style:normal;}

/* ── CHART ── */
.chart-wrap{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rl);padding:15px;margin-bottom:12px;}
.chart-title{font-family:var(--fc);font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
.chart-meta{font-size:11px;color:var(--td);margin-top:2px;margin-bottom:10px;}
.chart-legend{display:flex;gap:14px;margin-bottom:12px;}
.cli{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--td);}
.cld{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
canvas{width:100%!important;}

/* ── MUSCLE TAGS ── */
.mtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.mtag{background:rgba(227,6,19,.12);color:var(--red);border:1px solid rgba(227,6,19,.3);border-radius:4px;font-size:10px;font-weight:700;padding:2px 7px;text-transform:uppercase;letter-spacing:.04em;}

/* ── SETTINGS ── */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--b1);}
.set-row:last-child{border-bottom:none;}
.set-name{font-size:14px;font-weight:700;}
.set-sub{font-size:11px;color:var(--td);margin-top:2px;}
.set-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── BODY MAP ── */
.body-map-container{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);padding:14px;margin-bottom:14px;}
.body-map-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.body-map-title{font-family:var(--fc);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--td);}
.view-toggle{display:flex;gap:0;border:1px solid var(--b2);border-radius:6px;overflow:hidden;}
.vt-btn{background:var(--s3);border:none;color:var(--td);font-family:var(--f);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:5px 12px;cursor:pointer;transition:all .15s;}
.vt-btn.act{background:var(--red);color:#fff;}
.body-map-views{display:flex;gap:8px;justify-content:center;align-items:flex-start;}
.body-map-svg-wrap{flex:1;display:flex;flex-direction:column;align-items:center;}
.bm-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tf);margin-bottom:6px;}

/* muscle zone styles — filled dynamically by JS */
.mz{stroke-width:0.8;cursor:pointer;transition:fill .25s,stroke .25s;}
.mz:hover{filter:brightness(1.3);}
.body-outline-path{fill:#1e1e1e;stroke:#3a3a3a;stroke-width:1.2;}

/* ── HEATMAP LEGEND ── */
.hm-legend{display:flex;align-items:center;gap:8px;margin-top:10px;}
.hm-grad{flex:1;height:8px;border-radius:4px;background:linear-gradient(to right,#2e2e2e,#7a0000,#E30613,#ff6b35);}
.hm-lbl{font-size:9px;color:var(--tf);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}

/* ── MUSCLE CHECKLIST ── */
.muscle-checklist{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:220px;overflow-y:auto;padding-right:2px;}
.mcheck{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;border:1px solid var(--b1);background:var(--s2);cursor:pointer;transition:all .15s;font-size:11px;font-weight:700;color:var(--td);}
.mcheck.sel{background:rgba(227,6,19,.12);border-color:rgba(227,6,19,.4);color:var(--red);}

/* ── EMPTY ── */
.empty{text-align:center;padding:44px 20px;color:var(--tf);}
.empty .ei{font-size:42px;margin-bottom:10px;}
.empty h3{font-size:16px;font-weight:700;color:var(--td);margin-bottom:5px;}
.empty p{font-size:12px;line-height:1.5;}

.trend-up{color:var(--green);font-size:11px;font-weight:700;}
.trend-dn{color:var(--red);font-size:11px;font-weight:700;}

/* ── LOADING ── */
#loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.spinner{width:28px;height:28px;border:2px solid var(--b2);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-sub{font-size:12px;color:var(--td);}
</style>
</head>
<body>

<div id="loadingScreen">
  <svg width="60" height="60" viewBox="0 0 60 60"><polygon points="30,4 56,54 4,54" fill="#E30613"/><polygon points="30,18 44,48 16,48" fill="#9a0000" opacity=".5"/></svg>
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:.04em">Gym<span style="color:#E30613">Smart</span>Track</div>

  <div class="load-sub">Connessione al database…</div>
</div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 26 26"><polygon points="13,2 24,23 2,23" fill="#E30613"/><polygon points="13,9 19,21 7,21" fill="#9a0000" opacity=".5"/></svg>
      <div class="logo-name">Gym<em>Smart</em>Track</div>
    </div>
    <div class="person-scroll" id="personBar"></div>

</div>

<!-- PAGES -->
<div class="page act" id="page-log">
  <div class="ph">
    <div><div class="pdate" id="todayLabel"></div><div class="pt">Allenamento<br><em>di oggi</em></div></div>

  <div id="todayList"></div>

</div>

<div class="page" id="page-history">
  <div class="ph"><div class="pt">Storico<br><em>esercizi</em></div></div>

</div>

<div class="page" id="page-charts">
  <div class="ph"><div class="pt">Grafici<br><em>progressi</em></div></div>
  <div class="ig"><label>Seleziona esercizio</label><select id="chartSel" onchange="drawChart()"></select></div>
  <div id="chartArea"></div>
</div>

<div class="page" id="page-settings">
  <div class="ph"><div class="pt">Impo<em>stazioni</em></div></div>

</div>

<!-- NAV -->
<nav class="nav">

    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/></svg>Oggi

  <button class="nb" onclick="showPage('history',this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h10M4 18h6"/></svg>Storico
  </button>
  <button class="nb" onclick="showPage('charts',this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Grafici
  </button>
  <button class="nb" onclick="showPage('settings',this)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings
  </button>
</nav>

<!-- MODALS -->
<div class="modal-overlay" id="modal-addLog">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mt">Nuova <em>serie</em></div>
    <div class="ig"><label>Esercizio</label><input type="text" id="inEx" placeholder="es. Panca piana, Squat…" list="exSug" autocomplete="off"/><datalist id="exSug"></datalist></div>

    <div class="ig"><label>Data</label><input type="date" id="inDate"/></div>
    <button class="btn btn-full" onclick="saveLog()">Salva serie</button>
    <div style="height:8px"></div>
    <button class="btn ghost btn-full" onclick="closeModal('addLog')">Annulla</button>
  </div>
</div>

<div class="modal-overlay" id="modal-addUser">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mt">Nuovo <em>utente</em></div>
    <div class="ig"><label>Nome</label><input type="text" id="inUserName" placeholder="es. Mario Rossi"/></div>
    <button class="btn btn-full" onclick="saveUser()">Aggiungi</button>
    <div style="height:8px"></div>
    <button class="btn ghost btn-full" onclick="closeModal('addUser')">Annulla</button>
  </div>
</div>

<div class="modal-overlay" id="modal-renameUser">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mt">Rinomina <em>utente</em></div>
    <div class="ig"><label>Nuovo nome</label><input type="text" id="inRenameUser"/></div>
    <input type="hidden" id="renameUserId"/>
    <button class="btn btn-full" onclick="doRenameUser()">Salva</button>
    <div style="height:8px"></div>
    <button class="btn ghost btn-full" onclick="closeModal('renameUser')">Annulla</button>
  </div>
</div>

<div class="modal-overlay" id="modal-addEx">
  <div class="modal">
    <div class="mhandle"></div>

    <div class="ig"><label>Nome esercizio</label><input type="text" id="inExName" placeholder="es. Curl con manubri…"/></div>
    <div class="ig" style="margin-bottom:8px"><label>Muscoli coinvolti — tocca sulla mappa o sulla lista</label></div>
    <div style="display:flex;gap:14px;align-items:flex-start;">

      </div>
    </div>
    <div style="margin-top:10px;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--td);margin-bottom:6px;">Selezionati</div>
      <div class="mtags" id="selectedMuscleTags" style="min-height:20px;"></div>
    </div>
    <div style="height:12px"></div>
    <button class="btn btn-full" onclick="saveExercise()">Salva esercizio</button>
    <div style="height:8px"></div>
    <button class="btn ghost btn-full" onclick="closeModal('addEx')">Annulla</button>
  </div>
</div>

/* ═══════════════════════════════════════════════════
   HEATMAP COLOR
═══════════════════════════════════════════════════ */
function heatColor(count, max){
  if(!count) return '#2e2e2e';
  const t = count/max;
  if(t < 0.33) return `hsl(0,80%,${20+t*30}%)`;
  if(t < 0.66) return `hsl(0,90%,${30+t*20}%)`;
  return `hsl(${10-t*10},100%,${40+t*15}%)`;
}

/* ═══════════════════════════════════════════════════
   BODY MAP SVG BUILDER
═══════════════════════════════════════════════════ */
function buildBodySVG({id, view='front', interactive=false, heatmap=null, selectedIds=[], onToggle=null}){
  const muscles = view==='front' ? MUSCLES_FRONT : MUSCLES_BACK;
  const max = heatmap ? Math.max(1,...Object.values(heatmap)) : 1;

  const zones = muscles.map(m=>{
    let fill = '#2a2a2a';
    let stroke = '#444';
    if(heatmap && heatmap[m.id]){
      fill = heatColor(heatmap[m.id], max);
      stroke = fill;
    } else if(selectedIds.includes(m.id)){
      fill = '#E30613';
      stroke = '#ff3333';
    }
    const clickAttr = interactive
      ? `onclick="bmToggle('${id}','${m.id}','${m.label}',this)"`
      : heatmap ? `style="pointer-events:none"` : '';
    const tip = interactive ? `<title>${m.label}</title>` : heatmap && heatmap[m.id] ? `<title>${m.label}: ${heatmap[m.id]} esercizi</title>` : `<title>${m.label}</title>`;
    return `<path d="${m.d}" fill="${fill}" stroke="${stroke}" stroke-width="0.8" class="mz" data-mid="${m.id}" data-label="${m.label}" ${clickAttr} style="${interactive?'cursor:pointer':''}${heatmap?';pointer-events:none':''}">${tip}</path>`;
  }).join('');

  return `<svg id="${id}" viewBox="60 0 70 225" width="90" height="225" xmlns="http://www.w3.org/2000/svg">
    <path d="${BODY_SILHOUETTE}" fill="#1e1e1e" stroke="#333" stroke-width="1" fill-rule="evenodd"/>
    ${zones}
  </svg>`;
}

/* toggle a muscle on/off in the settings body map */
window.bmToggle = function(svgId, muscleId, muscleLabel, el){
  const idx = selectedMuscles.indexOf(muscleLabel);
  if(idx>=0) selectedMuscles.splice(idx,1);
  else selectedMuscles.push(muscleLabel);

  // sync SVG zones both front & back
  ['bm-settings-front','bm-settings-back'].forEach(sid=>{
    const svg = document.getElementById(sid);
    if(!svg) return;
    svg.querySelectorAll('.mz').forEach(z=>{
      if(z.dataset.label===muscleLabel){
        z.setAttribute('fill', selectedMuscles.includes(muscleLabel) ? '#E30613' : '#2a2a2a');
        z.setAttribute('stroke', selectedMuscles.includes(muscleLabel) ? '#ff3333' : '#444');
      }
    });
  });
  // sync checklist
  document.querySelectorAll('#muscleChecklist .mcheck').forEach(c=>{
    if(c.dataset.label===muscleLabel) c.classList.toggle('sel', selectedMuscles.includes(muscleLabel));
  });
  // update tags
  updateSelectedTags();
};

function updateSelectedTags(){
  const el = document.getElementById('selectedMuscleTags');
  el.innerHTML = selectedMuscles.length
    ? selectedMuscles.map(m=>`<span class="mtag">${m}</span>`).join('')
    : '<span style="color:var(--tf);font-size:11px">Nessuno selezionato</span>';
}

window.checklistToggle = function(label){
  const idx = selectedMuscles.indexOf(label);
  if(idx>=0) selectedMuscles.splice(idx,1);
  else selectedMuscles.push(label);
  // sync SVG
  ['bm-settings-front','bm-settings-back'].forEach(sid=>{
    const svg = document.getElementById(sid);
    if(!svg) return;
    svg.querySelectorAll('.mz').forEach(z=>{
      if(z.dataset.label===label){
        z.setAttribute('fill', selectedMuscles.includes(label)?'#E30613':'#2a2a2a');
        z.setAttribute('stroke', selectedMuscles.includes(label)?'#ff3333':'#444');
      }
    });
  });
  document.querySelectorAll('#muscleChecklist .mcheck').forEach(c=>{
    if(c.dataset.label===label) c.classList.toggle('sel', selectedMuscles.includes(label));
  });
  updateSelectedTags();
};

function buildSettingsBodyMap(){
  const allMuscles = [...MUSCLES_FRONT, ...MUSCLES_BACK];
  const unique = [];
  const seen = new Set();
  allMuscles.forEach(m=>{ if(!seen.has(m.label)){seen.add(m.label);unique.push(m);} });

  const el = document.getElementById('settingsBodyMap');
  el.innerHTML = `
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <button class="vt-btn act" id="vt-front" onclick="switchSettingsBmView('front')">Frontale</button>
      <button class="vt-btn" id="vt-back" onclick="switchSettingsBmView('back')">Retro</button>
    </div>
    <div id="bm-front-wrap">${buildBodySVG({id:'bm-settings-front',view:'front',interactive:true,selectedIds:[]})}</div>
    <div id="bm-back-wrap" style="display:none">${buildBodySVG({id:'bm-settings-back',view:'back',interactive:true,selectedIds:[]})}</div>
  `;

  // checklist: all unique muscles
  document.getElementById('muscleChecklist').innerHTML = unique.map(m=>
    `<div class="mcheck" data-label="${m.label}" onclick="checklistToggle('${m.label}')">${m.label}</div>`
  ).join('');
}

window.switchSettingsBmView = function(v){
  document.getElementById('bm-front-wrap').style.display = v==='front'?'':'none';
  document.getElementById('bm-back-wrap').style.display = v==='back'?'':'none';
  document.getElementById('vt-front').classList.toggle('act', v==='front');
  document.getElementById('vt-back').classList.toggle('act', v==='back');
};

  setSync('ok','online');
  renderPersonBar();renderToday();renderHistory();populateSug();
  if(document.getElementById('page-settings').classList.contains('act')) renderSettings();
}, ()=>{ setSync('err','offline'); document.getElementById('loadingScreen').style.display='none'; });

   TODAY
═══════════════════════════════════════════════════ */
function renderToday(){
  const list = document.getElementById('todayList');
  const mapWrap = document.getElementById('todayMapWrap');
  const t = today();
  const tl = curLogs().filter(l=>l.date===t);

  if(!tl.length){
    list.innerHTML=`<div class="empty"><div class="ei">🏋️</div><h3>Nessun esercizio oggi</h3><p>Tocca "+ Aggiungi" per iniziare.</p></div>`;
    mapWrap.innerHTML='';
    return;
  }

  // group by exercise
  const grouped={};
  tl.forEach(l=>{ if(!grouped[l.exercise])grouped[l.exercise]=[]; grouped[l.exercise].push(l); });

  list.innerHTML=Object.entries(grouped).map(([ex,entries])=>{
    const last=entries[entries.length-1];
    const prev=bestBefore(ex,t);
    let trend='';
    if(prev){const d=+(last.weight-prev.weight).toFixed(1);if(d>0)trend=`<span class="trend-up">▲ +${d} kg</span>`;else if(d<0)trend=`<span class="trend-dn">▼ ${d} kg</span>`;else trend=`<span style="color:var(--tf);font-size:11px">= stabile</span>`;}
    const rows=entries.map(e=>`<div class="lr"><div><div class="lv">${e.weight} kg</div><div class="ls">${e.reps} rip.</div></div><div class="icon-btn" onclick="delLog('${e.id}')"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div></div>`).join('');
    return `<div class="card rl"><div class="cr"><div><div class="cn">${ex}</div><div class="cm">${entries.length} serie &nbsp;${trend}</div></div><div class="badge red">${last.weight} kg</div></div><div style="margin-top:8px">${rows}</div></div>`;
  }).join('');

  // build heatmap from today's exercises
  const heatF={}, heatB={};
  const exNames = Object.keys(grouped);
  exNames.forEach(ex=>{
    const preset = presetExercises.find(e=>e.name===ex);
    if(!preset||!preset.muscles) return;
    preset.muscles.forEach(label=>{
      // find muscle id from label
      const mf = MUSCLES_FRONT.find(m=>m.label===label);
      const mb = MUSCLES_BACK.find(m=>m.label===label);
      if(mf){ heatF[mf.id] = (heatF[mf.id]||0)+1; }
      if(mb){ heatB[mb.id] = (heatB[mb.id]||0)+1; }
    });
  });

  const hasHeat = Object.keys(heatF).length||Object.keys(heatB).length;
  if(!hasHeat){ mapWrap.innerHTML=''; return; }

  const maxVal = Math.max(1,...Object.values({...heatF,...heatB}));
  mapWrap.innerHTML=`
    <div class="body-map-container">
      <div class="body-map-header">
        <div class="body-map-title">Muscoli allenati oggi</div>
      </div>
      <div class="body-map-views">
        <div class="body-map-svg-wrap">
          <div class="bm-label">Frontale</div>
          ${buildBodySVG({id:'today-bm-front',view:'front',heatmap:heatF})}
        </div>
        <div class="body-map-svg-wrap">
          <div class="bm-label">Retro</div>
          ${buildBodySVG({id:'today-bm-back',view:'back',heatmap:heatB})}
        </div>
      </div>
      <div class="hm-legend">
        <div class="hm-lbl">Basso</div>
        <div class="hm-grad"></div>
        <div class="hm-lbl">Alto</div>
      </div>
      <div style="font-size:10px;color:var(--tf);margin-top:6px;">Calore proporzionale al numero di esercizi che coinvolgono quel muscolo</div>
    </div>`;
}

    const xl=ml.filter(l=>l.exercise===ex).sort((a,b)=>b.date.localeCompare(a.date));
    const pr=Math.max(...xl.map(l=>l.weight));
    const mr=Math.max(...xl.map(l=>l.reps));
    const preset=presetExercises.find(e=>e.name===ex);
    const muscleHtml=preset&&preset.muscles&&preset.muscles.length
      ?`<div class="mtags">${preset.muscles.slice(0,4).map(m=>`<span class="mtag">${m}</span>`).join('')}${preset.muscles.length>4?`<span class="mtag">+${preset.muscles.length-4}</span>`:''}</div>`:'';
    return `<div class="card"><div class="cr"><div style="min-width:0"><div class="cn">${ex}</div><div class="cm">${xl.length} sessioni · ultimo ${fmtFull(xl[0].date)}</div>${muscleHtml}</div><div style="display:flex;gap:5px;flex-shrink:0"><div class="badge red">${pr} kg</div><div class="badge grey">${mr} reps</div></div></div></div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════
   CHARTS
═══════════════════════════════════════════════════ */
function renderChartPage(){
  const sel=document.getElementById('chartSel');
  const exs=[...new Set(curLogs().map(l=>l.exercise))].sort();
  sel.innerHTML=exs.length?exs.map(e=>`<option value="${e}">${e}</option>`).join(''):'<option value="">Nessun dato</option>';
  drawChart();
}
window.drawChart = ()=>{
  const area=document.getElementById('chartArea');
  const exercise=document.getElementById('chartSel').value;
  if(!exercise){area.innerHTML=`<div class="empty"><div class="ei">📈</div><h3>Nessun dato</h3><p>Aggiungi allenamenti per vedere i progressi.</p></div>`;return;}
  const ml=curLogs().filter(l=>l.exercise===exercise).sort((a,b)=>a.date.localeCompare(b.date));
  const byDate={};
  ml.forEach(l=>{if(!byDate[l.date])byDate[l.date]={weight:0,reps:0};if(l.weight>byDate[l.date].weight)byDate[l.date].weight=l.weight;if(l.reps>byDate[l.date].reps)byDate[l.date].reps=l.reps;});
  const labels=Object.keys(byDate).map(fmtShort);
  const weights=Object.values(byDate).map(v=>v.weight);
  const reps=Object.values(byDate).map(v=>v.reps);
  const prKg=Math.max(...weights);
  const progKg=+(weights[weights.length-1]-weights[0]).toFixed(1);
  const prR=Math.max(...reps);
  const preset=presetExercises.find(e=>e.name===exercise);
  const muscleHtml=preset&&preset.muscles&&preset.muscles.length?`<div class="mtags" style="margin-bottom:10px">${preset.muscles.map(m=>`<span class="mtag">${m}</span>`).join('')}</div>`:'';
  area.innerHTML=`
    <div class="sg"><div class="sb"><div class="sv">${prKg} kg</div><div class="slb">Carico max</div></div><div class="sb"><div class="sv ${progKg>=0?'g':''}">${progKg>=0?'+':''}${progKg}</div><div class="slb">Progresso</div></div><div class="sb"><div class="sv w">${prR}</div><div class="slb">Max reps</div></div></div>
    ${muscleHtml}
    <div class="chart-wrap">
      <div class="chart-title">${exercise}</div>
      <div class="chart-meta">Carico (kg) e ripetizioni per sessione</div>
      <div class="chart-legend"><div class="cli"><div class="cld" style="background:#E30613"></div>Carico (kg)</div><div class="cli"><div class="cld" style="background:#aaa"></div>Ripetizioni</div></div>
      <canvas id="myChart" height="220"></canvas>
    </div>`;
  if(chartInst){chartInst.destroy();chartInst=null;}
  chartInst=new Chart(document.getElementById('myChart').getContext('2d'),{data:{labels,datasets:[{type:'line',label:'Carico',data:weights,yAxisID:'yKg',borderColor:'#E30613',backgroundColor:'rgba(227,6,19,0.10)',pointBackgroundColor:'#E30613',pointBorderColor:'#1c1c1c',pointBorderWidth:2,pointRadius:5,pointHoverRadius:7,borderWidth:2.5,tension:0.3,fill:true,order:1},{type:'line',label:'Reps',data:reps,yAxisID:'yReps',borderColor:'#aaaaaa',backgroundColor:'rgba(170,170,170,0.04)',pointBackgroundColor:'#aaaaaa',pointBorderColor:'#1c1c1c',pointBorderWidth:2,pointRadius:4,pointHoverRadius:6,borderWidth:2,tension:0.3,fill:true,borderDash:[5,3],order:2}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#252525',borderColor:'#3d3d3d',borderWidth:1,titleColor:'#888',titleFont:{family:'Barlow',size:11,weight:'600'},padding:10,callbacks:{label:c=>c.dataset.yAxisID==='yKg'?`  Carico: ${c.raw} kg`:`  Reps: ${c.raw}`}}},scales:{x:{ticks:{color:'#666',font:{family:'Barlow',size:10},maxRotation:45},grid:{color:'#222'},border:{color:'#333'}},yKg:{type:'linear',position:'left',ticks:{color:'#E30613',font:{family:'Barlow',size:11},callback:v=>v+' kg'},grid:{color:'#222'},border:{color:'#333'},title:{display:true,text:'kg',color:'#E30613',font:{family:'Barlow',size:11,weight:'700'}}},yReps:{type:'linear',position:'right',ticks:{color:'#aaa',font:{family:'Barlow',size:11},callback:v=>v+' rep'},grid:{drawOnChartArea:false},border:{color:'#333'},title:{display:true,text:'reps',color:'#aaa',font:{family:'Barlow',size:11,weight:'700'}}}}}});
};

/* ═══════════════════════════════════════════════════
   SETTINGS
═══════════════════════════════════════════════════ */
function renderSettings(){
  // users
  document.getElementById('userList').innerHTML=persons.map(p=>`
    <div class="set-row">
      <div><div class="set-name">${p.name}</div></div>
      <div class="set-actions">
        <div class="icon-btn" onclick="openRenameUser('${p.id}')"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
        ${persons.length>1?`<div class="icon-btn" onclick="deleteUser('${p.id}')"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div>`:''}
      </div>
    </div>`).join('');
  // exercises
  const el=document.getElementById('exList');
  if(!presetExercises.length){el.innerHTML=`<div style="font-size:12px;color:var(--tf);padding:8px 0">Nessun esercizio preconfigurato.</div>`;return;}
  el.innerHTML=presetExercises.map(e=>`
    <div class="card" style="margin-bottom:7px">
      <div class="cr">
        <div style="min-width:0">
          <div class="cn">${e.name}</div>
          <div class="mtags" style="margin-top:5px">${(e.muscles||[]).map(m=>`<span class="mtag">${m}</span>`).join('')}</div>
        </div>
        <div class="icon-btn" onclick="deleteExercise('${e.id}')"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div>
      </div>
    </div>`).join('');
}

window.openRenameUser = id=>{
  const p=persons.find(p=>p.id===id);
  document.getElementById('inRenameUser').value=p.name;
  document.getElementById('renameUserId').value=id;
  openModal('renameUser');
};
window.doRenameUser = async()=>{
  const id=document.getElementById('renameUserId').value;
  const name=document.getElementById('inRenameUser').value.trim();
  if(!name)return;
  setSync('loading','salvataggio…');
  try{ await updateDoc(doc(db,'persons',id),{name}); closeModal('renameUser'); }
  catch(e){ setSync('err','errore'); }
};
window.saveUser = async()=>{
  const name=document.getElementById('inUserName').value.trim();
  if(!name)return;
  setSync('loading','salvataggio…');
  try{
    const ref=await addDoc(collection(db,'persons'),{name,createdAt:Date.now()});
    currentPerson=ref.id; localStorage.setItem('gst_person',currentPerson);
    document.getElementById('inUserName').value='';
    closeModal('addUser');
  }catch(e){setSync('err','errore');}
};
window.deleteUser = async id=>{
  if(persons.length<=1)return;
  if(!confirm('Eliminare questo utente?'))return;
  setSync('loading','eliminazione…');
  try{ await deleteDoc(doc(db,'persons',id)); if(currentPerson===id){currentPerson=persons.find(p=>p.id!==id)?.id;localStorage.setItem('gst_person',currentPerson||'');} }
  catch(e){setSync('err','errore');}
};
window.saveExercise = async()=>{
  const name=document.getElementById('inExName').value.trim();
  if(!name){alert('Inserisci il nome!');return;}
  setSync('loading','salvataggio…');
  try{
    await addDoc(collection(db,'exercises'),{name,muscles:[...selectedMuscles],createdAt:Date.now()});
    document.getElementById('inExName').value='';
    selectedMuscles=[];
    closeModal('addEx');
  }catch(e){setSync('err','errore');alert('Errore: '+e.message);}
};
window.deleteExercise = async id=>{
  if(!confirm('Eliminare questo esercizio?'))return;
  try{ await deleteDoc(doc(db,'exercises',id)); }
  catch(e){ alert('Errore: '+e.message); }
};

/* ═══════════════════════════════════════════════════
   LOG ACTIONS
═══════════════════════════════════════════════════ */
window.saveLog = async()=>{
  const exercise=document.getElementById('inEx').value.trim();
  const weight=parseFloat(document.getElementById('inKg').value);
  const reps=parseInt(document.getElementById('inRep').value);
  const date=document.getElementById('inDate').value||today();
  if(!exercise||isNaN(weight)||isNaN(reps)){alert('Inserisci esercizio, carico e ripetizioni!');return;}
  setSync('loading','salvataggio…');
  try{
    await addDoc(collection(db,'logs'),{personId:currentPerson,exercise,weight,reps,sets:1,date,createdAt:Date.now()});
    closeModal('addLog');
    ['inEx','inKg','inRep'].forEach(id=>document.getElementById(id).value='');
  }catch(e){setSync('err','errore');alert('Errore: '+e.message);}
};
window.delLog = async id=>{
  if(!confirm('Eliminare questa serie?'))return;
  setSync('loading','eliminazione…');
  try{ await deleteDoc(doc(db,'logs',id)); }
  catch(e){ setSync('err','errore'); }
};

function populateSug(){
  const all=[...new Set([...presetExercises.map(e=>e.name),...logs.map(l=>l.exercise)])].sort();
  document.getElementById('exSug').innerHTML=all.map(e=>`<option value="${e}">`).join('');
}

/* ═══════════════════════════════════════════════════
   MODALS
═══════════════════════════════════════════════════ */
window.openModal = id=>{
  if(id==='addEx'){
    selectedMuscles=[];
    buildSettingsBodyMap();
    document.getElementById('selectedMuscleTags').innerHTML='';
    document.getElementById('inExName').value='';
  }
  if(id==='addLog') document.getElementById('inDate').value=today();
  document.getElementById('modal-'+id).classList.add('open');
};
window.closeModal = id=>document.getElementById('modal-'+id).classList.remove('open');
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));

/* CSS for view toggle buttons (added dynamically) */
const style=document.createElement('style');
style.textContent=`.vt-btn{background:var(--s3);border:1px solid var(--b2);color:var(--td);font-family:var(--f);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:5px 12px;cursor:pointer;transition:all .15s;}.vt-btn:first-child{border-radius:6px 0 0 6px;border-right:none;}.vt-btn:last-child{border-radius:0 6px 6px 0;}.vt-btn.act{background:var(--red);color:#fff;border-color:var(--red);}`;
document.head.appendChild(style);
</script>
</body>
